services:
  app:
    restart: always
    build:
      context: .
      dockerfile: Dockerfile.image
    image: datalith
    container_name: datalith
    environment:
      TZ: Asia/Taipei
      DATALITH_MAX_FILE_SIZE: 2 GiB
      DATALITH_WORKERS: 1
      DATALITH_TASK_RETENTION_SECONDS: 604800
      DATALITH_MAX_IMAGE_RESOLUTION: 50000000
      DATALITH_MAX_IMAGE_RESOLUTION_MULTIPLIER: 3
      DATALITH_MAX_IMAGE_FRAMES: 500
      DATALITH_MAX_IMAGE_TOTAL_PIXELS: 100000000
      DATALITH_MAX_IMAGE_VARIANTS: 16
    volumes:
      - ~/docker/datalith:/app/shared
    ports:
      - "127.0.0.1:1111:1111"
    command: --environment /app/shared/db
    logging:
      driver: "syslog"
      options:
        tag: "docker/{{.ImageName}}/{{.Name}}"
