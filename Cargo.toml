[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

[workspace]
resolver = "3"
members = ["datalith-core", "datalith"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.94"

[workspace.dependencies]
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt-multi-thread", "sync", "time"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
